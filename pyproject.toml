[project]
name = "a2a-auction-protocol"
version = "0.3.0"
description = "Reusable A2A marketplace auction protocol models and capability declarations."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23.0",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_auction_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
